<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF8E8">
  <title>My Collection — 我的收藏庫</title>
  <link rel="stylesheet" href="./style.css">
  <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <header class="brand"><span class="brand-icon">▤</span><span><strong>My Collection</strong><small>我的靈感收藏庫</small></span><button id="closeSidebar" class="icon-btn mobile-only" title="關閉選單" aria-label="關閉選單">✕</button></header>
      <div class="sidebar-main">
        <button class="nav-all active" id="allArticles"><span class="nav-icon" aria-hidden="true">📚</span> 全部收藏 <span class="count" id="allCount">0</span></button>
        <div class="side-label"><span>分類目錄</span><button id="addRoot" class="small-icon-btn" title="新增主分類" aria-label="新增主分類">＋</button></div>
        <div class="favorite-categories" id="favoriteSection" hidden>
          <div class="side-label favorite-label">常用分類 <span class="favorite-hint">☆ 點星號加入</span></div>
          <div id="favoriteCategoryList"></div>
        </div>
        <nav id="categoryTree" class="category-tree" aria-label="文章分類"></nav>
      </div>
      <footer class="sidebar-footer"><button id="exportData" class="footer-btn">↥ 匯出資料</button><button id="importData" class="footer-btn">↧ 匯入資料</button><input id="importFile" type="file" accept="application/json,.json" hidden><span class="footer-hint">資料儲存於 Google Sheets</span></footer>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="main-content">
      <div class="topbar"><button id="menuSidebar" class="icon-btn mobile-only" title="開啟分類選單" aria-label="開啟分類選單">☰</button><div class="search-area"><span class="search-icon">⌕</span><input id="searchInput" type="search" placeholder="搜尋文章、分類、標籤或筆記..." autocomplete="off"><kbd>/</kbd></div><button id="newArticle" class="primary-btn">＋ <span>新增收藏</span></button></div>
      <div class="content-wrap">
        <section class="filter-panel" aria-label="進階搜尋篩選">
          <div class="filter-heading"><strong>快速篩選</strong><button type="button" id="clearFilters" class="filter-clear">清除篩選</button></div>
          <div class="filter-grid">
            <label class="filter-field">分類
              <select id="filterCategory" aria-label="依分類篩選"><option value="">全部分類</option></select>
            </label>
            <label class="filter-field">標籤<select id="filterTag" aria-label="依標籤篩選"><option value="">全部標籤</option></select></label>
            <label class="filter-field">來源網站
              <select id="filterSource" aria-label="依來源網站篩選"><option value="">全部來源網站</option></select>
            </label>
            <label class="filter-field">收藏日期起
              <input type="date" id="filterDateStart" aria-label="收藏日期起">
            </label>
            <label class="filter-field">收藏日期迄
              <input type="date" id="filterDateEnd" aria-label="收藏日期迄">
            </label>
          </div>
          <label class="pinned-only"><input type="checkbox" id="filterPinned"> 只看釘選文章</label>
        </section>
        <section class="page-intro"><div class="eyebrow">YOUR PERSONAL LIBRARY</div><div class="intro-heading"><div><h1 id="pageTitle">全部收藏</h1><p id="pageSubtitle">收藏值得一讀的好內容，讓每個想法都有自己的位置。</p></div><div class="intro-count"><strong id="visibleCount">0</strong><span>篇收藏</span></div></div></section>
        <section class="toolbar"><div class="crumbs" id="breadcrumbs"></div><div class="toolbar-actions"><button type="button" class="secondary-btn compact-btn" id="randomExplore">🔀 隨機看看</button><button type="button" class="text-btn" id="exitExplore" hidden>結束探索</button><button type="button" class="secondary-btn compact-btn" id="batchToggle">☑ 批次管理</button><select id="sortSelect" aria-label="排序"><option value="newest">最近收藏</option><option value="oldest">最早收藏</option><option value="title">標題 A–Z</option><option value="updated">最近修改</option><option value="source">來源網站</option><option value="random">隨機排序</option></select><div class="view-switch" role="group" aria-label="顯示模式"><button id="gridView" class="active" aria-label="卡片檢視" title="卡片檢視">▦</button><button id="listView" aria-label="清單檢視" title="清單檢視">☷</button></div></div></section>
        <div id="batchToolbar" class="batch-toolbar" hidden>
          <span>已選 <strong id="selectedCount">0</strong> 篇</span>
          <button type="button" id="batchSelectAll">選取目前結果</button><button type="button" id="batchClear">清空</button>
          <select id="batchCategory" aria-label="批次移動的分類"><option value="">選擇目的分類</option></select>
          <button type="button" data-batch-action="move">移動分類</button>
          <button type="button" data-batch-action="addTags">新增標籤</button>
          <button type="button" data-batch-action="pin">全部釘選</button>
          <button type="button" data-batch-action="unpin">取消釘選</button>
          <button type="button" data-batch-action="delete" class="danger-outline">刪除選取</button>
        </div>
        <div class="health-panel"><span id="healthInfo">資料檢查中…</span><button type="button" id="repairData">重新檢查資料</button></div>
        <div id="articles" class="articles grid-view"></div>
        <div id="emptyState" class="empty-state" hidden><div class="empty-icon">◇</div><h2>還沒有找到文章</h2><p id="emptyDescription">換個關鍵字搜尋，或新增第一篇收藏吧。</p><button id="emptyAdd" class="secondary-btn">＋ 新增收藏</button></div>
      </div>
    </main>
  </div>

  <dialog id="articleDialog" class="modal"><form id="articleForm" method="dialog" novalidate><div class="modal-header"><div><span class="modal-eyebrow">COLLECTION</span><h2 id="articleDialogTitle">新增收藏</h2></div><button type="button" class="close-btn" data-close="articleDialog" aria-label="關閉">✕</button></div><div class="modal-body">
    <label for="articleUrl">文章網址 <span class="required">*</span></label><input id="articleUrl" type="url" placeholder="https://example.com/article" required><small class="field-help">請選擇分類；標題、摘要和封面若未填寫，GAS 將嘗試自動擷取。</small>
    <label for="articleTitle">文章標題</label><input id="articleTitle" placeholder="例如：值得收藏的 AI 工具整理">
    <label for="articleCategory">主要分類</label><select id="articleCategory"><option value="">請選擇分類</option></select>
    <label for="articleTags">標籤 <span class="muted">（用逗號分隔）</span></label><input id="articleTags" placeholder="AI 工具, 生產力, 網站資源">
    <label for="articleDescription">文章摘要</label><textarea id="articleDescription" rows="3" placeholder="這篇文章的重點是什麼？"></textarea>
    <label for="articleNotes">我的筆記</label><textarea id="articleNotes" rows="3" placeholder="收藏這篇文章的原因、自己的想法... "></textarea>
    <label for="articleImage">封面圖片網址 <span class="muted">（選填）</span></label><input id="articleImage" type="url" placeholder="https://example.com/image.jpg">
    <p id="articleFormError" class="error-text" hidden></p>
  </div><div class="modal-footer"><button type="button" class="danger-text-btn" id="deleteArticleFromDialog" hidden>刪除收藏</button><button type="button" class="secondary-btn" data-close="articleDialog">取消</button><button type="submit" class="primary-btn">儲存收藏</button></div></form></dialog>

  <dialog id="categoryDialog" class="modal small-modal"><form id="categoryForm" method="dialog" novalidate><div class="modal-header"><div><span class="modal-eyebrow">CATEGORIES</span><h2 id="categoryDialogTitle">新增分類</h2></div><button type="button" class="close-btn" data-close="categoryDialog" aria-label="關閉">✕</button></div><div class="modal-body"><label for="categoryName">分類名稱 <span class="required">*</span></label><input id="categoryName" maxlength="60" placeholder="例如：東京美食" required><label for="categoryParent">上層分類</label><select id="categoryParent"><option value="">無（主分類）</option></select><p class="field-help">選擇上層分類就能建立子分類；不限制分類層數。</p><p id="categoryFormError" class="error-text" hidden></p></div><div class="modal-footer"><button type="button" class="secondary-btn" data-close="categoryDialog">取消</button><button type="submit" class="primary-btn">儲存分類</button></div></form></dialog>


  <dialog id="confirmDialog" class="modal small-modal"><div class="modal-header"><div><span class="modal-eyebrow">CONFIRMATION</span><h2 id="confirmTitle">確認操作</h2></div><button type="button" class="close-btn" data-close="confirmDialog" aria-label="關閉">✕</button></div><div class="modal-body"><p id="confirmMessage"></p></div><div class="modal-footer"><button type="button" class="secondary-btn" data-close="confirmDialog">取消</button><button type="button" id="confirmAction" class="danger-btn">確認</button></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script src="./bridge-client.js"></script>
  <script src="./app.js"></script>
</body>
</html>
