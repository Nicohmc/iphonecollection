<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFF8E8">
  <meta name="referrer" content="no-referrer">
  <title>加入 My Collection</title>
  <link rel="stylesheet" href="./capture.css">
</head>
<body>
<main class="capture-layout">
  <header class="capture-header">
    <a class="brand" href="./index.html" aria-label="回到 My Collection">▤ MY COLLECTION</a>
    <h1>收藏這篇文章</h1>
    <p>使用 GitHub 收藏頁，文章仍會存進原本的 Google Sheets。</p>
  </header>
  <section class="panel" id="capturePanel">
    <form id="captureForm" novalidate>
      <label for="articleUrl">文章網址 <span class="required">*</span></label>
      <input class="field" id="articleUrl" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/article" required maxlength="3000">
      <label for="articleTitle">文章標題</label>
      <input class="field" id="articleTitle" name="title" type="text" maxlength="300" placeholder="輸入你想收藏的文章標題" autocomplete="off">
      <p class="hint">可自行編輯標題；留空時，後端會嘗試從網頁自動取得。</p>
      <label for="category">收藏分類 <span class="required">*</span></label>
      <select class="field" id="category" required disabled><option value="">正在讀取分類…</option></select>
      <div id="path" class="crumb" hidden></div>
      <label for="tags">標籤 <span class="optional">（選填）</span></label>
      <input class="field" id="tags" type="text" maxlength="1000" placeholder="例如：日本、交通、攻略（逗號分隔）" autocomplete="off">
      <label for="notes">備註 <span class="optional">（選填）</span></label>
      <textarea class="field" id="notes" rows="3" maxlength="5000" placeholder="想記住的重點…"></textarea>
      <div class="actions">
        <button type="button" class="secondary" id="reloadBtn">重新載入分類</button>
        <button type="submit" class="primary" id="saveBtn" disabled>儲存到 My Collection</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">正在連接 Google Sheets…</div>
    </form>
  </section>
  <section class="panel success-panel" id="successPanel" hidden>
    <div class="check" aria-hidden="true">✓</div>
    <h2 id="successTitle">收藏成功！</h2>
    <p id="savedTitle"></p>
    <div class="actions">
      <a class="primary button-link" href="./index.html">查看我的收藏</a>
      <button type="button" class="secondary" id="anotherBtn">再收藏一篇</button>
    </div>
  </section>
  <p class="footer-note">若分類一直無法讀取，可能是瀏覽器封鎖 GAS 內嵌橋接。<a id="gasFallback" target="_self" rel="noopener noreferrer">改用原本的 GAS 收藏頁</a></p>
</main>
<script src="./config.js"></script>
<script src="./bridge-client.js"></script>
<script src="./capture.js"></script>
</body>
</html>
