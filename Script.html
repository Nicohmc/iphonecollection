<script>
'use strict';
const $=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>{try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};
const hostOf=s=>{try{return new URL(s).hostname.replace(/^www\./,'')}catch{return '收藏網址'}};
let token=sessionStorage.getItem('myCollectionToken')||'',db={categories:[],articles:[]},selected=null,expanded=new Set(),search='',view='grid',editArticleId=null,editCategoryId=null,detailId=null,busy=false;
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3500)}
function api(action,payload={}){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r):reject(Error(r?.error||'未知錯誤'))).withFailureHandler(e=>reject(Error(e.message||String(e)))).uiCall(token,action,payload);});}
async function load(){const result=await api('snapshot');db.categories=result.categories.map(c=>({id:String(c.id),name:String(c.name),parent:String(c.parentId||'')||null,order:Number(c.sortOrder)||0}));db.articles=result.articles.map(a=>({id:String(a.id),url:String(a.url),title:String(a.title||''),description:String(a.description||''),image:String(a.imageUrl||''),category:String(a.categoryId||'')||null,tags:String(a.tags||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),notes:String(a.notes||''),createdAt:String(a.createdAt||'')}));render();}
async function mutation(action,payload,message){if(busy)return;busy=true;try{const r=await api(action,payload);await load();if(message)toast(message);return r;}catch(e){toast('操作失敗：'+e.message);throw e;}finally{busy=false}}
function getCat(id){return db.categories.find(c=>c.id===id)}
function children(p){return db.categories.filter(c=>c.parent===(p||null)).sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name,'zh-Hant'))}
function descendants(id){const ids=new Set([id]);let changed=true;while(changed){changed=false;db.categories.forEach(c=>{if(ids.has(c.parent)&&!ids.has(c.id)){ids.add(c.id);changed=true}})}return ids}
function lineage(id){let out=[],node=getCat(id);while(node&&out.length<100){out.unshift(node);node=getCat(node.parent)}return out}
function pathText(id){return id?lineage(id).map(c=>c.name).join(' / '):'未分類'}
function options(select,allowEmpty,exclude){const block=exclude?descendants(exclude):new Set(),list=[];function walk(p,depth){children(p).forEach(c=>{if(block.has(c.id))return;list.push({id:c.id,name:'　'.repeat(depth)+c.name});walk(c.id,depth+1)})}walk(null,0);select.innerHTML=(allowEmpty?'<option value="">'+(select.id==='categoryParent'?'無（主分類）':'請選擇分類')+'</option>':'')+list.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('')}
function selectCategory(id){selected=id;$('#allArticles').classList.toggle('active',!id);render();$('#sidebar').classList.remove('open');$('#sidebarBackdrop').classList.remove('open')}
function renderTree(){const holder=$('#categoryTree');holder.innerHTML='';function add(p,depth){children(p).forEach(c=>{const kids=children(c.id).length,row=document.createElement('div');row.className='cat-row'+(selected===c.id?' selected':'');row.style.paddingLeft=(depth*13+3)+'px';row.draggable=true;row.innerHTML=`<button class="cat-caret" aria-label="展開或收合">${kids?(expanded.has(c.id)?'⌄':'›'):'·'}</button><span class="cat-name">${escapeHtml(c.name)}</span><button class="cat-more" title="管理分類" aria-label="管理分類">⋯</button>`;row.querySelector('.cat-caret').onclick=()=>{if(expanded.has(c.id))expanded.delete(c.id);else expanded.add(c.id);renderTree()};row.querySelector('.cat-name').onclick=()=>selectCategory(c.id);row.querySelector('.cat-more').onclick=e=>{e.stopPropagation();categoryMenu(c.id)};row.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.id);e.dataTransfer.effectAllowed='move'};row.ondragover=e=>{e.preventDefault();row.classList.add('drag-over')};row.ondragleave=()=>row.classList.remove('drag-over');row.ondrop=async e=>{e.preventDefault();row.classList.remove('drag-over');const src=e.dataTransfer.getData('text/plain');if(src&&src!==c.id&&!descendants(src).has(c.id)){const item=getCat(src);if(item){await mutation('updateCategory',{id:src,name:item.name,parentId:c.id},'分類已移動');expanded.add(c.id);renderTree();}}};holder.append(row);if(expanded.has(c.id))add(c.id,depth+1)})}add(null,0);$('#allCount').textContent=db.articles.length}
function categoryMenu(id){const c=getCat(id);if(!c)return;const chosen=prompt(`管理「${c.name}」\n1 新增子分類\n2 編輯／移動\n3 往上排序\n4 往下排序\n5 合併分類\n6 刪除分類\n請輸入 1～6`);if(chosen==='1')openCategoryDialog(null,id);if(chosen==='2')openCategoryDialog(id);if(chosen==='3'||chosen==='4')mutation('reorderCategory',{id,direction:chosen==='3'?-1:1},'排序已更新');if(chosen==='5')mergeCategory(id);if(chosen==='6'){const count=db.articles.filter(a=>descendants(id).has(a.category)).length;if(confirm(`刪除「${c.name}」及全部子分類？\n${count} 篇文章將保留，但變成未分類。`))mutation('deleteCategory',{id},'分類已刪除')}}
function mergeCategory(id){const choices=db.categories.filter(c=>!descendants(id).has(c.id));if(!choices.length)return toast('沒有可合併的分類');const lines=choices.map((c,i)=>`${i+1}. ${pathText(c.id)}`).join('\n'),number=Number(prompt(`合併「${getCat(id).name}」到哪個分類？輸入數字：\n${lines}`));const dest=choices[number-1];if(!dest)return;if(confirm(`將此分類及子分類中的文章，移至「${pathText(dest.id)}」，並刪除原分類？`))mutation('mergeCategory',{id,destinationId:dest.id},'分類已合併')}
function articleArt(a){const url=safeUrl(a.image);return `<div class="card-art" style="--art-bg:#e8eee7">${url?`<img src="${escapeHtml(url)}" alt="" loading="lazy">`:'✦'}</div>`}
function filteredArticles(){const ids=selected?descendants(selected):null;return db.articles.filter(a=>(!ids||ids.has(a.category))&&[a.title,a.url,a.description,a.notes,...a.tags,pathText(a.category)].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>{const sort=$('#sortSelect').value;return sort==='title'?a.title.localeCompare(b.title,'zh-Hant'):sort==='oldest'?String(a.createdAt).localeCompare(String(b.createdAt)):String(b.createdAt).localeCompare(String(a.createdAt))})}
function renderArticles(){const list=filteredArticles(),el=$('#articles');$('#visibleCount').textContent=list.length;$('#emptyState').hidden=list.length>0;el.className='articles '+(view==='grid'?'grid-view':'list-view');el.innerHTML=list.map(a=>`<article class="article-card" data-id="${escapeHtml(a.id)}" tabindex="0">${articleArt(a)}<div class="card-body"><div class="card-category">${escapeHtml(pathText(a.category))}</div><div class="card-title">${escapeHtml(a.title||a.url)}</div><p class="card-description">${escapeHtml(a.description||'點開查看這篇收藏的詳細資訊')}</p>${a.tags.length?`<div class="card-tags">${a.tags.slice(0,4).map(t=>`<span class="tag"># ${escapeHtml(t)}</span>`).join('')}</div>`:''}<div class="card-bottom"><span>${escapeHtml(hostOf(a.url))}</span><span>${escapeHtml(formatDate(a.createdAt))}</span></div></div></article>`).join('');el.querySelectorAll('[data-id]').forEach(card=>{card.onclick=()=>showDetail(card.dataset.id);card.onkeydown=e=>{if(e.key==='Enter')showDetail(card.dataset.id)}});}
function render(){renderTree();const c=getCat(selected);$('#pageTitle').textContent=c?.name||'全部收藏';$('#pageSubtitle').textContent=c?`瀏覽「${c.name}」以及所有下層分類中的收藏。`:'收藏值得一讀的好內容，讓每個想法都有自己的位置。';$('#breadcrumbs').textContent=c?'我的收藏 / '+pathText(selected):'我的收藏';renderArticles()}
function formatDate(t){const date=new Date(t);return isNaN(date)?'':date.toLocaleDateString('zh-TW')}
function openArticleDialog(id=null){editArticleId=id;const a=db.articles.find(x=>x.id===id);$('#articleDialogTitle').textContent=a?'編輯收藏':'新增收藏';options($('#articleCategory'),true);$('#articleUrl').value=a?.url||'';$('#articleTitle').value=a?.title||'';$('#articleCategory').value=a?.category||selected||'';$('#articleTags').value=(a?.tags||[]).join(', ');$('#articleDescription').value=a?.description||'';$('#articleNotes').value=a?.notes||'';$('#articleImage').value=a?.image||'';$('#articleFormError').hidden=true;$('#articleDialog').showModal()}
function openCategoryDialog(id=null,parent=null){editCategoryId=id;const c=getCat(id);$('#categoryDialogTitle').textContent=c?'編輯分類':'新增分類';$('#categoryName').value=c?.name||'';options($('#categoryParent'),true,id);$('#categoryParent').value=c?.parent||parent||'';$('#categoryFormError').hidden=true;$('#categoryDialog').showModal()}
function showDetail(id){const a=db.articles.find(x=>x.id===id);if(!a)return;detailId=id;$('#detailContent').innerHTML=`${articleArt(a).replace("card-art","detail-art")}<h2 class="detail-title">${escapeHtml(a.title||a.url)}</h2><div class="detail-meta">${escapeHtml(pathText(a.category))}　·　${escapeHtml(hostOf(a.url))}　·　${escapeHtml(formatDate(a.createdAt))}</div>${a.tags.length?`<div class="detail-tags">${a.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`:''}${a.description?`<section class="detail-section"><h3>文章摘要</h3><p>${escapeHtml(a.description)}</p></section>`:''}${a.notes?`<section class="detail-section"><h3>我的筆記</h3><p>${escapeHtml(a.notes)}</p></section>`:''}`;$('#openArticle').href=safeUrl(a.url)||'#';$('#detailDialog').showModal()}
function download(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-collection-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#articleForm').onsubmit=async e=>{e.preventDefault();const url=safeUrl($('#articleUrl').value.trim()),categoryId=$('#articleCategory').value;if(!url||!categoryId){$('#articleFormError').hidden=false;$('#articleFormError').textContent='請填寫有效文章網址，並選擇分類';return}const payload={id:editArticleId,url,categoryId,title:$('#articleTitle').value.trim(),description:$('#articleDescription').value.trim(),imageUrl:$('#articleImage').value.trim(),tags:$('#articleTags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),notes:$('#articleNotes').value.trim()};try{const r=await mutation(editArticleId?'updateArticle':'addArticle',payload,editArticleId?'文章已更新':'文章已儲存');$('#articleDialog').close();if(r?.status==='duplicate')toast('這篇文章已經收藏過了')}catch(err){$('#articleFormError').hidden=false;$('#articleFormError').textContent=err.message}};
$('#categoryForm').onsubmit=async e=>{e.preventDefault();const name=$('#categoryName').value.trim(),parentId=$('#categoryParent').value;try{await mutation(editCategoryId?'updateCategory':'createCategory',{id:editCategoryId,name,parentId},'分類已儲存');$('#categoryDialog').close();if(parentId)expanded.add(parentId);renderTree()}catch(err){$('#categoryFormError').hidden=false;$('#categoryFormError').textContent=err.message}};
$('#newArticle').onclick=$('#emptyAdd').onclick=()=>openArticleDialog();$('#addRoot').onclick=()=>openCategoryDialog();$('#allArticles').onclick=()=>selectCategory(null);$('#searchInput').oninput=e=>{search=e.target.value;renderArticles()};$('#sortSelect').onchange=renderArticles;$('#gridView').onclick=()=>{view='grid';$('#gridView').classList.add('active');$('#listView').classList.remove('active');renderArticles()};$('#listView').onclick=()=>{view='list';$('#listView').classList.add('active');$('#gridView').classList.remove('active');renderArticles()};$('#editArticle').onclick=()=>{$('#detailDialog').close();openArticleDialog(detailId)};$('#deleteArticle').onclick=()=>{const id=detailId;$('#detailDialog').close();if(confirm('確定刪除這篇收藏？'))mutation('deleteArticle',{id},'收藏已刪除')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#menuSidebar').onclick=()=>{$('#sidebar').classList.add('open');$('#sidebarBackdrop').classList.add('open')};$('#closeSidebar').onclick=$('#sidebarBackdrop').onclick=()=>{$('#sidebar').classList.remove('open');$('#sidebarBackdrop').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();$('#searchInput').focus()}});
$('#exportData').onclick=download;$('#importData').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.articles)||!Array.isArray(obj.categories))throw Error('格式不正確');if(confirm(`⚠️ 這會覆蓋 Google Sheets 目前全部的文章與分類！\n檔案有 ${obj.articles.length} 篇文章、${obj.categories.length} 個分類。\n請先匯出備份。確定嗎？`)){await mutation('importData',{data:obj,confirmReplace:true},'匯入完成');selected=null;render()}}catch(err){toast('匯入失敗：'+err.message)}e.target.value=''};
$('#loginForm').onsubmit=async e=>{e.preventDefault();token=$('#apiToken').value.trim();$('#loginError').hidden=true;try{await load();sessionStorage.setItem('myCollectionToken',token);$('#loginDialog').close();toast('已連接 Google Sheets')}catch(err){$('#loginError').textContent=err.message;$('#loginError').hidden=false}};
if(token){load().catch(()=>{sessionStorage.removeItem('myCollectionToken');token='';$('#loginDialog').showModal()})}else $('#loginDialog').showModal();
</script>
